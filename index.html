<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IBBRA Talents — Funil de Recrutamento & Seleção</title>
  <meta name="description" content="IBBRA Talents: plataforma interna de recrutamento e seleção da IBBRA Full Family Office. Análise inteligente de currículos, funil em pipeline, indicadores e planilha consolidada." />

  <link rel="icon" href="assets/img/ibbra-simbolo.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
</head>
<body>
  <header id="topbar" class="topbar"></header>

  <main>
    <section id="view-login"      class="view active"></section>
    <section id="view-funil"      class="view"></section>
    <section id="view-analise"    class="view"></section>
    <section id="view-indicadores" class="view"></section>
    <section id="view-planilha"   class="view"></section>
    <section id="view-candidato"  class="view"></section>
    <section id="view-td"         class="view"></section>
    <section id="view-config"     class="view"></section>
  </main>

  <footer id="footer" class="footer"></footer>

  <div id="nuke-confirm" class="nuke-confirm" hidden role="dialog" aria-modal="true" aria-labelledby="nuke-title">
    <div class="nuke-overlay" data-close="overlay"></div>
    <div class="nuke-dialog">
      <h3 id="nuke-title">Excluir todos os candidatos?</h3>
      <p class="nuke-lead">Essa ação é <strong>irreversível</strong>. Vai apagar a base inteira de candidatos (currículos, análises, diagnósticos, comentários, histórico). <em>Não</em> afeta seu login, a chave da Claude API, vagas, expertises ou certificações.</p>
      <label for="nuke-phrase">Digite exatamente <code>EXCLUIR TUDO</code> para confirmar:</label>
      <input type="text" id="nuke-phrase" autocomplete="off" placeholder="EXCLUIR TUDO" />
      <label class="nuke-ack">
        <input type="checkbox" id="nuke-ack" />
        Entendo que essa ação é irreversível.
      </label>
      <div class="nuke-actions">
        <button type="button" class="btn btn-ghost-on-light" data-close="cancel">Cancelar</button>
        <button type="button" class="btn btn-danger" id="nuke-confirm-btn" disabled>Excluir candidatos agora</button>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ai.js"></script>
  <script src="assets/js/dossier.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
